<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microgreen Manager (Cloud)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #198754, #20c997);
        }

        .dashboard-container {
            display: none;
            padding-bottom: 80px;
        }

        .card-icon {
            font-size: 2rem;
            opacity: 0.8;
        }

        .bg-gradient-success {
            background: linear-gradient(45deg, #28a745, #218838);
            color: white;
        }

        .bg-gradient-danger {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
        }

        .bg-gradient-info {
            background: linear-gradient(45deg, #17a2b8, #138496);
            color: white;
        }

        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        #loadingSpinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div id="loadingSpinner" class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <div id="loginSection" class="login-container">
        <div class="card shadow-lg p-4" style="width: 350px;">
            <div class="text-center mb-4">
                <i class="fas fa-leaf fa-3x text-success"></i>
                <h3 class="mt-2">MicroGreen Cloud</h3>
                <small class="text-muted">Admin Panel</small>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="passwordInput" class="form-control">
            </div>
            <button onclick="login()" class="btn btn-success w-100">Login</button>
            <p id="loginError" class="text-danger text-center mt-2" style="display:none;">Incorrect Password</p>
        </div>
    </div>

    <div id="dashboardSection" class="dashboard-container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="#"><i class="fas fa-leaf me-2"></i> MicroGreen Cloud</a>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
            </div>
        </nav>

        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-secondary mb-0">Dashboard</h4>
                <div class="d-flex align-items-center">
                    <label class="me-2 fw-bold text-muted">Filter:</label>
                    <select id="monthFilter" class="form-select form-select-sm" style="width: 160px;"
                        onchange="applyFilter()">
                        <option value="all">All Time</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div class="card bg-gradient-success shadow border-0">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-uppercase mb-1">Total Income</h6>
                                <h3 class="fw-bold" id="totalIncome">$0.00</h3>
                            </div>
                            <div class="card-icon"><i class="fas fa-wallet"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-gradient-danger shadow border-0">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-uppercase mb-1">Total Expenses</h6>
                                <h3 class="fw-bold" id="totalExpense">$0.00</h3>
                            </div>
                            <div class="card-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-gradient-info shadow border-0">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-uppercase mb-1">Net Profit</h6>
                                <h3 class="fw-bold" id="netProfit">$0.00</h3>
                            </div>
                            <div class="card-icon"><i class="fas fa-chart-line"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">History</h6>
                    <div>
                        <button class="btn btn-success btn-sm me-2" onclick="exportToCSV()"><i
                                class="fas fa-file-csv"></i> Export</button>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal"><i
                                class="fas fa-plus"></i> Add New</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover" width="100%">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn btn-primary fab d-md-none" data-bs-toggle="modal" data-bs-target="#addModal"><i
                class="fas fa-plus"></i></button>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Transaction</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="transactionForm">
                        <div class="mb-3">
                            <label>Type</label>
                            <select class="form-select" id="type" onchange="updateCategories()">
                                <option value="Expense">Expense</option>
                                <option value="Income">Income</option>
                            </select>
                        </div>
                        <div class="mb-3"><label>Category</label><select class="form-select" id="category"></select>
                        </div>
                        <div class="mb-3"><label>Amount</label><input type="number" class="form-control" id="amount"
                                required step="0.01"></div>
                        <div class="mb-3"><label>Description</label><input type="text" class="form-control"
                                id="description"></div>
                        <div class="mb-3"><label>Date</label><input type="date" class="form-control" id="date" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveTransaction()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // =========================================================
        // 1. PASTE YOUR FIREBASE CONFIG HERE (Replace the whole block)
        // =========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB3ZXhX_ZYvceoGS5Pfhr1o99cIVt2YFOY",
            authDomain: "microgreenapp-ec220.firebaseapp.com",
            databaseURL: "https://microgreenapp-ec220-default-rtdb.firebaseio.com",
            projectId: "microgreenapp-ec220",
            storageBucket: "microgreenapp-ec220.firebasestorage.app",
            messagingSenderId: "836473742197",
            appId: "1:836473742197:web:c1ea7a36fc59c30e83293c",
            measurementId: "G-NKWM36YW3G"
        };
        // =========================================================

        // Initialize Firebase
        // const app = initializeApp(firebaseConfig);
        // const analytics = getAnalytics(app);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // State Variables
        const PASSWORD = "fafmicrogreen";
        let transactions = [];
        const expenseCategories = ["Electricity Bill", "Seeds", "Soil/Medium", "Trays/Pots", "Packaging", "Labor", "Water", "Other"];
        const incomeCategories = ["Sales - Restaurants", "Sales - Farmers Market", "Sales - Direct", "Other Income"];
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        // ============ AUTH & DATA LOADING ============
        function checkAuth() {
            const isLogged = localStorage.getItem('isLogged');
            if (isLogged === 'true') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadDataFromFirebase();
            } else {
                document.getElementById('loginSection').style.display = 'flex';
                document.getElementById('dashboardSection').style.display = 'none';
            }
        }

        function login() {
            if (document.getElementById('passwordInput').value === PASSWORD) {
                localStorage.setItem('isLogged', 'true');
                checkAuth();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
        function logout() { localStorage.removeItem('isLogged'); location.reload(); }

        // ============ FIREBASE CRUD ============
        function loadDataFromFirebase() {
            document.getElementById('loadingSpinner').style.display = 'block';

            // Listen for changes in Realtime
            db.ref('transactions').on('value', (snapshot) => {
                const data = snapshot.val();
                transactions = [];
                if (data) {
                    // Convert Object back to Array
                    Object.keys(data).forEach(key => {
                        transactions.push({
                            id: key, // Firebase Key
                            ...data[key]
                        });
                    });
                }

                document.getElementById('loadingSpinner').style.display = 'none';
                initDashboard();
            });
        }

        function saveTransaction() {
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const desc = document.getElementById('description').value;
            const date = document.getElementById('date').value;

            if (!amount || !date) { alert("Please fill Amount and Date"); return; }

            // Push to Firebase
            const newTx = { date, type, category, amount, desc: desc || '-' };
            db.ref('transactions').push(newTx, (error) => {
                if (error) { alert("Error saving data: " + error); }
                else {
                    // Success UI updates
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
                    modal.hide();
                    document.getElementById('transactionForm').reset();
                    document.getElementById('date').valueAsDate = new Date();
                }
            });
        }

        function deleteTransaction(firebaseId) {
            if (confirm("Delete this transaction?")) {
                db.ref('transactions/' + firebaseId).remove();
            }
        }

        // ============ DASHBOARD LOGIC (Same as before) ============
        function initDashboard() {
            populateFilterOptions();
            renderDashboard();
            updateCategories();
            document.getElementById('date').valueAsDate = new Date();
        }

        function populateFilterOptions() {
            const filterSelect = document.getElementById('monthFilter');
            const currentSelection = filterSelect.value;
            filterSelect.innerHTML = '<option value="all">All Time</option>';

            const months = new Set();
            transactions.forEach(t => { if (t.date && t.date.length >= 7) months.add(t.date.slice(0, 7)); });

            const sortedMonths = Array.from(months).sort().reverse();
            sortedMonths.forEach(monthStr => {
                const parts = monthStr.split('-');
                const label = `${monthNames[parseInt(parts[1]) - 1]} ${parts[0]}`;
                const option = document.createElement('option');
                option.value = monthStr;
                option.innerText = label;
                filterSelect.appendChild(option);
            });

            if (sortedMonths.includes(currentSelection)) filterSelect.value = currentSelection;
        }

        function renderDashboard() {
            const filterVal = document.getElementById('monthFilter').value;
            const displayData = filterVal === 'all' ? transactions : transactions.filter(t => t.date.startsWith(filterVal));

            // Table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const sorted = [...displayData].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sorted.length === 0) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No records</td></tr>';

            sorted.forEach(t => {
                const row = `<tr>
                    <td>${t.date}</td>
                    <td><span class="badge ${t.type === 'Income' ? 'bg-success' : 'bg-danger'}">${t.type}</span></td>
                    <td>${t.category}</td>
                    <td>${t.desc}</td>
                    <td>${t.amount.toFixed(2)}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteTransaction('${t.id}')"><i class="fas fa-trash"></i></button></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            // Totals
            let income = 0, expense = 0;
            displayData.forEach(t => { t.type === 'Income' ? income += t.amount : expense += t.amount; });
            document.getElementById('totalIncome').innerText = income.toFixed(2);
            document.getElementById('totalExpense').innerText = expense.toFixed(2);
            const profit = income - expense;
            const pEl = document.getElementById('netProfit');
            pEl.innerText = profit.toFixed(2);
            pEl.className = profit >= 0 ? "fw-bold text-success" : "fw-bold text-danger";
        }

        function updateCategories() {
            const type = document.getElementById('type').value;
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = "";
            (type === 'Expense' ? expenseCategories : incomeCategories).forEach(cat => {
                const opt = document.createElement('option'); opt.value = cat; opt.innerText = cat; catSelect.appendChild(opt);
            });
        }

        function applyFilter() { renderDashboard(); }

        function exportToCSV() {
            const filterVal = document.getElementById('monthFilter').value;
            const displayData = filterVal === 'all' ? transactions : transactions.filter(t => t.date.startsWith(filterVal));
            if (displayData.length === 0) { alert("No data"); return; }

            let csv = "Date,Type,Category,Description,Amount\n";
            displayData.forEach(row => {
                csv += `${row.date},${row.type},${row.category},"${row.desc.replace(/"/g, '""')}",${row.amount}\n`;
            });
            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = "microgreen_data.csv";
            link.click();
        }

        checkAuth();
    </script>
</body>

</html>
