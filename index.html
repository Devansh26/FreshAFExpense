<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microgreen Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #198754, #20c997);
        }

        .dashboard-container {
            display: none;
            /* Hidden by default */
            padding-bottom: 80px;
        }

        .card-icon {
            font-size: 2rem;
            opacity: 0.8;
        }

        .bg-gradient-success {
            background: linear-gradient(45deg, #28a745, #218838);
            color: white;
        }

        .bg-gradient-danger {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
        }

        .bg-gradient-info {
            background: linear-gradient(45deg, #17a2b8, #138496);
            color: white;
        }

        /* Floating Action Button for Mobile */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
    </style>
</head>

<body>

    <div id="loginSection" class="login-container">
        <div class="card shadow-lg p-4" style="width: 350px;">
            <div class="text-center mb-4">
                <i class="fas fa-leaf fa-3x text-success"></i>
                <h3 class="mt-2">MicroGreen Manager</h3>
                <small class="text-muted">Admin Panel</small>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="Enter password">
            </div>
            <button onclick="login()" class="btn btn-success w-100">Login</button>
            <p id="loginError" class="text-danger text-center mt-2" style="display:none;">Incorrect Password</p>
        </div>
    </div>

    <div id="dashboardSection" class="dashboard-container">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="#"><i class="fas fa-leaf me-2"></i> MicroGreen Manager</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="backupData()"><i class="fas fa-download"></i> Backup
                                Data</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="document.getElementById('restoreFile').click()"><i
                                    class="fas fa-upload"></i> Restore Data</a>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-outline-light btn-sm ms-2 mt-1" onclick="logout()">Logout</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <input type="file" id="restoreFile" style="display: none;" accept=".json" onchange="restoreData(this)">

        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="text-secondary mb-0">Dashboard</h4>
                <div class="d-flex align-items-center">
                    <label class="me-2 fw-bold text-muted">Filter:</label>
                    <select id="monthFilter" class="form-select form-select-sm" style="width: 160px;"
                        onchange="applyFilter()">
                        <option value="all">All Time</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div class="card bg-gradient-success shadow border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Total Income</h6>
                                <h3 class="fw-bold" id="totalIncome">$0.00</h3>
                            </div>
                            <div class="card-icon"><i class="fas fa-wallet"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-gradient-danger shadow border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Total Expenses</h6>
                                <h3 class="fw-bold" id="totalExpense">$0.00</h3>
                            </div>
                            <div class="card-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-gradient-info shadow border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Net Profit</h6>
                                <h3 class="fw-bold" id="netProfit">$0.00</h3>
                            </div>
                            <div class="card-icon"><i class="fas fa-chart-line"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-12">
                    <div class="card shadow">
                        <div
                            class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <h6 class="m-0 font-weight-bold text-primary">Transaction History</h6>
                            <div>
                                <button class="btn btn-success btn-sm me-2" onclick="exportToCSV()">
                                    <i class="fas fa-file-csv"></i> Export CSV
                                </button>
                                <button class="btn btn-primary btn-sm" data-bs-toggle="modal"
                                    data-bs-target="#addModal">
                                    <i class="fas fa-plus"></i> Add New
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover" id="dataTable" width="100%"
                                    cellspacing="0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Date</th>
                                            <th>Type</th>
                                            <th>Category</th>
                                            <th>Description</th>
                                            <th>Amount</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary fab d-md-none" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="transactionForm">
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" id="type" onchange="updateCategories()">
                                <option value="Expense">Expense</option>
                                <option value="Income">Income</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="category">
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" class="form-control" id="amount" required step="0.01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description (Optional)</label>
                            <input type="text" class="form-control" id="description"
                                placeholder="e.g. Radish Seeds, Electricity Jan">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveTransaction()">Save Transaction</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ================= CONFIG & STATE =================
        const PASSWORD = "fafmicrogreen";
        let transactions = JSON.parse(localStorage.getItem('microgreenData')) || [];

        const expenseCategories = ["Electricity Bill", "Seeds", "Soil/Medium", "Trays/Pots", "Packaging", "Labor", "Water", "Other"];
        const incomeCategories = ["Sales - Restaurants", "Sales - Farmers Market", "Sales - Direct", "Other Income"];

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        // ================= AUTHENTICATION =================
        function checkAuth() {
            const isLogged = localStorage.getItem('isLogged');
            if (isLogged === 'true') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                initDashboard();
            } else {
                document.getElementById('loginSection').style.display = 'flex';
                document.getElementById('dashboardSection').style.display = 'none';
            }
        }

        function login() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                localStorage.setItem('isLogged', 'true');
                checkAuth();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('isLogged');
            location.reload();
        }

        // ================= DASHBOARD LOGIC =================
        function initDashboard() {
            populateFilterOptions();
            renderDashboard();
            updateCategories();
            document.getElementById('date').valueAsDate = new Date();
        }

        function populateFilterOptions() {
            const filterSelect = document.getElementById('monthFilter');
            const currentSelection = filterSelect.value;

            // Keep "All Time"
            filterSelect.innerHTML = '<option value="all">All Time</option>';

            // Extract unique YYYY-MM
            const months = new Set();
            transactions.forEach(t => {
                // t.date format is YYYY-MM-DD
                if (t.date && t.date.length >= 7) {
                    months.add(t.date.slice(0, 7));
                }
            });

            // Sort descending
            const sortedMonths = Array.from(months).sort().reverse();

            sortedMonths.forEach(monthStr => {
                // FIXED LOGIC: Manual parsing to avoid Timezone shifts
                // monthStr looks like "2025-11"
                const parts = monthStr.split('-');
                const year = parts[0];
                const monthIndex = parseInt(parts[1]) - 1; // 0-11

                // Create label "November 2025" manually
                const label = `${monthNames[monthIndex]} ${year}`;

                const option = document.createElement('option');
                option.value = monthStr;
                option.innerText = label;
                filterSelect.appendChild(option);
            });

            // Restore selection if valid
            if (sortedMonths.includes(currentSelection)) {
                filterSelect.value = currentSelection;
            }
        }

        function applyFilter() {
            renderDashboard();
        }

        function getFilteredTransactions() {
            const filterVal = document.getElementById('monthFilter').value;
            if (filterVal === 'all') {
                return transactions;
            }
            return transactions.filter(t => t.date.startsWith(filterVal));
        }

        function renderDashboard() {
            const displayData = getFilteredTransactions();
            renderTable(displayData);
            calculateTotals(displayData);
        }

        function updateCategories() {
            const type = document.getElementById('type').value;
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = "";
            const list = type === 'Expense' ? expenseCategories : incomeCategories;
            list.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.innerText = cat;
                catSelect.appendChild(option);
            });
        }

        function saveTransaction() {
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const desc = document.getElementById('description').value;
            const date = document.getElementById('date').value;

            if (!amount || !date) {
                alert("Please fill in Amount and Date");
                return;
            }

            const newTx = {
                id: Date.now(),
                date,
                type,
                category,
                amount,
                desc: desc || '-'
            };

            transactions.push(newTx);
            localStorage.setItem('microgreenData', JSON.stringify(transactions));

            const modalEl = document.getElementById('addModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            document.getElementById('transactionForm').reset();
            document.getElementById('date').valueAsDate = new Date();

            populateFilterOptions();
            renderDashboard();
        }

        function deleteTransaction(id) {
            if (confirm("Are you sure you want to delete this?")) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('microgreenData', JSON.stringify(transactions));
                populateFilterOptions();
                renderDashboard();
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No records found for this period</td></tr>';
                return;
            }

            const sorted = [...data].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(t => {
                const row = `
                    <tr>
                        <td>${t.date}</td>
                        <td><span class="badge ${t.type === 'Income' ? 'bg-success' : 'bg-danger'}">${t.type}</span></td>
                        <td>${t.category}</td>
                        <td>${t.desc}</td>
                        <td>${t.amount.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteTransaction(${t.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function calculateTotals(data) {
            let income = 0;
            let expense = 0;

            data.forEach(t => {
                if (t.type === 'Income') income += t.amount;
                else expense += t.amount;
            });

            document.getElementById('totalIncome').innerText = income.toFixed(2);
            document.getElementById('totalExpense').innerText = expense.toFixed(2);

            const profit = income - expense;
            const profitEl = document.getElementById('netProfit');
            profitEl.innerText = profit.toFixed(2);
            profitEl.className = profit >= 0 ? "fw-bold text-success" : "fw-bold text-danger";
        }

        // ================= CSV EXPORT =================
        function exportToCSV() {
            const dataToExport = getFilteredTransactions();
            if (dataToExport.length === 0) {
                alert("No data to export for the selected period!");
                return;
            }

            const filterName = document.getElementById('monthFilter').options[document.getElementById('monthFilter').selectedIndex].text;
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `Filter: ${filterName}\n`;
            csvContent += "Date,Type,Category,Description,Amount\n";

            dataToExport.forEach(row => {
                let cleanDesc = row.desc.replace(/"/g, '""');
                let rowString = `${row.date},${row.type},${row.category},"${cleanDesc}",${row.amount}`;
                csvContent += rowString + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            const safeFilterName = filterName.replace(/ /g, "_");
            link.setAttribute("download", `microgreen_${safeFilterName}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ================= BACKUP & RESTORE =================
        function backupData() {
            const dataStr = JSON.stringify(transactions);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const exportFileDefaultName = 'microgreen_backup_' + new Date().toISOString().slice(0, 10) + '.json';

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function restoreData(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const content = e.target.result;
                    const parsedData = JSON.parse(content);

                    if (Array.isArray(parsedData)) {
                        if (confirm("This will overwrite your current data with the backup. Are you sure?")) {
                            transactions = parsedData;
                            localStorage.setItem('microgreenData', JSON.stringify(transactions));
                            alert("Data restored successfully!");
                            location.reload();
                        }
                    } else {
                        alert("Invalid backup file format.");
                    }
                } catch (error) {
                    alert("Error parsing file: " + error);
                }
            };
            reader.readAsText(file);
            // Reset input so you can upload the same file again if needed
            inputElement.value = '';
        }

        // Initialize
        checkAuth();

    </script>
</body>

</html>
